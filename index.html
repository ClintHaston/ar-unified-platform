<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, which
         is what keeps the bottom tab bar clear of the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Asset-Resource Platform</title>

    <!-- ── PWA ── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1A212E" />
    <meta name="description" content="My Day, contacts, quick log and tasks — the four screens a rep works from the truck." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <!-- iOS: reps carry iPhones too, and Safari reads none of the manifest's
         install metadata. apple-touch-icon is the home-screen tile;
         status-bar-style "default" is the black-on-white bar that matches the
         app's white topbar (black-translucent would slide content under it). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AR Platform" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
